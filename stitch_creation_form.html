<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create New Bill - The Fluid Ledger</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-highest": "#e2e2e4",
                      "secondary-fixed": "#d9e2ff",
                      "on-tertiary": "#ffffff",
                      "on-tertiary-fixed-variant": "#7b2e12",
                      "on-primary-container": "#8690ee",
                      "on-tertiary-fixed": "#390c00",
                      "background": "#f9f9fb",
                      "inverse-surface": "#2f3132",
                      "secondary-fixed-dim": "#b0c6ff",
                      "secondary-container": "#0f6df3",
                      "primary": "#000666",
                      "outline-variant": "#c6c5d4",
                      "on-primary": "#ffffff",
                      "primary-fixed-dim": "#bdc2ff",
                      "on-background": "#1a1c1d",
                      "tertiary-fixed-dim": "#ffb59d",
                      "on-error": "#ffffff",
                      "surface-container-high": "#e8e8ea",
                      "secondary": "#0056c5",
                      "surface": "#f9f9fb",
                      "inverse-on-surface": "#f0f0f2",
                      "on-surface-variant": "#454652",
                      "surface-bright": "#f9f9fb",
                      "on-primary-fixed": "#000767",
                      "on-secondary-fixed": "#001945",
                      "surface-container-lowest": "#ffffff",
                      "surface-variant": "#e2e2e4",
                      "tertiary-fixed": "#ffdbd0",
                      "on-secondary-container": "#fefcff",
                      "on-primary-fixed-variant": "#343d96",
                      "primary-container": "#1a237e",
                      "surface-container-low": "#f3f3f5",
                      "surface-dim": "#d9dadc",
                      "on-surface": "#1a1c1d",
                      "on-tertiary-container": "#e17c5a",
                      "primary-fixed": "#e0e0ff",
                      "error-container": "#ffdad6",
                      "on-secondary": "#ffffff",
                      "on-secondary-fixed-variant": "#00429b",
                      "tertiary-container": "#5c1800",
                      "error": "#ba1a1a",
                      "surface-container": "#eeeef0",
                      "on-error-container": "#93000a",
                      "tertiary": "#380b00",
                      "inverse-primary": "#bdc2ff",
                      "surface-tint": "#4c56af",
                      "outline": "#767683"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {},
              "fontFamily": {
                      "headline": [
                              "Manrope"
                      ],
                      "body": [
                              "Inter"
                      ],
                      "label": [
                              "Inter"
                      ]
              }
      },
          },
        }
      </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex flex-col pb-32">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-6 py-4 bg-[#f9f9fb] dark:bg-slate-950 docked full-width top-0 bg-[#f3f3f5] dark:bg-slate-900 flat no shadows sticky z-40">
<button aria-label="Go Back" class="text-[#1A237E] dark:text-blue-400 hover:opacity-80 transition-opacity scale-95 active:transition-transform flex items-center justify-center w-10 h-10 rounded-full bg-surface-container-low">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-[#1A237E] dark:text-blue-400 font-['Manrope'] font-bold text-xl tracking-tight">Create New Bill</h1>
<div class="w-10 h-10 rounded-full bg-surface-container-low overflow-hidden flex items-center justify-center">
<!-- Placeholder for avatar if needed to balance header, but JSON says trailing avatar, though not strictly required for this specific 'Create' flow, keeping space for balance -->
<span class="material-symbols-outlined text-outline">more_vert</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-4 sm:px-6 lg:px-8 max-w-3xl mx-auto w-full pt-6">
<!-- Product Card 1 -->
<section class="bg-surface-container-lowest rounded-DEFAULT p-6 mb-6 shadow-[0_8px_24px_rgba(26,35,126,0.04)] relative overflow-hidden group">
<!-- Header/Delete -->
<div class="flex justify-between items-center mb-6">
<h2 class="font-headline font-bold text-lg text-primary">Product 1</h2>
<button aria-label="Delete Product" class="text-outline-variant hover:text-error transition-colors flex items-center justify-center w-10 h-10 rounded-full hover:bg-error-container/20">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">delete</span>
</button>
</div>
<!-- Floating Label Input: Product Name -->
<div class="relative mb-6">
<input class="peer w-full h-14 px-4 pt-4 pb-1 rounded-DEFAULT bg-surface-container-highest border-0 focus:ring-1 focus:ring-primary/40 focus:bg-surface-container-lowest transition-all font-body text-on-surface" id="product-name-1" placeholder=" " type="text" value="Ergonomic Desk Chair"/>
<label class="absolute left-4 top-4 text-on-surface-variant font-body text-sm transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-base peer-focus:top-1 peer-focus:text-[10px] peer-focus:text-secondary pointer-events-none" for="product-name-1">Product Name</label>
</div>
<!-- Progressive Disclosure Group: Quantity & Model -->
<div class="grid grid-cols-2 gap-4 mb-8">
<div class="relative">
<input class="peer w-full h-14 px-4 pt-4 pb-1 rounded-DEFAULT bg-surface-container-highest border-0 focus:ring-1 focus:ring-primary/40 focus:bg-surface-container-lowest transition-all font-body text-on-surface" id="qty-1" placeholder=" " type="number" value="3"/>
<label class="absolute left-4 top-4 text-on-surface-variant font-body text-sm transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-base peer-focus:top-1 peer-focus:text-[10px] peer-focus:text-secondary pointer-events-none" for="qty-1">Quantity</label>
</div>
<div class="relative">
<input class="peer w-full h-14 px-4 pt-4 pb-1 rounded-DEFAULT bg-surface-container-highest border-0 focus:ring-1 focus:ring-primary/40 focus:bg-surface-container-lowest transition-all font-body text-on-surface" id="model-1" placeholder=" " type="text" value="HMX-900"/>
<label class="absolute left-4 top-4 text-on-surface-variant font-body text-sm transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-base peer-focus:top-1 peer-focus:text-[10px] peer-focus:text-secondary pointer-events-none" for="model-1">Model Number</label>
</div>
</div>
<!-- Serial Number Module -->
<div class="bg-surface-container-low rounded-DEFAULT p-5">
<h3 class="font-headline font-bold text-sm text-on-surface-variant mb-4">Serial Numbers (3)</h3>
<!-- Horizontal Tab Bar -->
<div class="flex overflow-x-auto gap-2 mb-5 pb-2 scrollbar-hide">
<button class="px-5 py-2 rounded-full bg-primary text-on-primary font-body text-sm font-medium whitespace-nowrap shadow-[0_4px_12px_rgba(26,35,126,0.15)]">Serial 1</button>
<button class="px-5 py-2 rounded-full bg-surface-container-highest text-on-surface-variant font-body text-sm font-medium whitespace-nowrap hover:bg-surface-container-high transition-colors border border-outline-variant/15">Serial 2</button>
<button class="px-5 py-2 rounded-full bg-surface-container-highest text-on-surface-variant font-body text-sm font-medium whitespace-nowrap hover:bg-surface-container-high transition-colors border border-outline-variant/15">Serial 3</button>
</div>
<!-- Active Serial Input + Scanner -->
<div class="flex gap-3 items-end">
<div class="relative flex-1">
<input class="peer w-full h-16 px-4 pt-5 pb-1 rounded-DEFAULT bg-surface-container-highest border-0 focus:ring-1 focus:ring-primary/40 focus:bg-surface-container-lowest transition-all font-headline font-bold text-lg text-primary tracking-wider" id="serial-1" placeholder=" " type="text" value="SN-8923-ABCD"/>
<label class="absolute left-4 top-5 text-on-surface-variant font-body text-sm transition-all peer-placeholder-shown:top-5 peer-placeholder-shown:text-base peer-focus:top-1.5 peer-focus:text-[10px] peer-focus:text-secondary pointer-events-none uppercase tracking-wider" for="serial-1">Scan or Enter Serial</label>
</div>
<button class="w-16 h-16 rounded-DEFAULT bg-gradient-to-br from-primary to-primary-container flex items-center justify-center text-on-primary shadow-[0_8px_24px_rgba(26,35,126,0.2)] hover:shadow-[0_12px_32px_rgba(26,35,126,0.3)] transition-all flex-shrink-0 relative">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">barcode_scanner</span>
<!-- Pulse effect -->
<div class="absolute inset-0 rounded-DEFAULT border-2 border-primary-fixed-dim opacity-50 animate-pulse"></div>
</button>
</div>
</div>
<!-- Zebra striping background illusion for card depth -->
<div class="absolute -inset-1 bg-gradient-to-b from-white/40 to-transparent pointer-events-none mix-blend-overlay"></div>
</section>
<!-- Add Another Product Button -->
<div class="flex justify-center mt-8 mb-12">
<button class="flex items-center gap-2 px-6 py-3 rounded-full bg-transparent text-secondary font-body font-medium hover:bg-secondary-container/10 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">add_circle</span>
                Add Another Product
            </button>
</div>
</main>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 left-0 w-full p-6 bg-gradient-to-t from-surface via-surface/90 to-transparent z-50 flex justify-center backdrop-blur-sm pointer-events-none">
<button class="pointer-events-auto w-full max-w-sm h-14 rounded-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold text-lg tracking-wide shadow-[0_8px_24px_rgba(26,35,126,0.15)] hover:shadow-[0_12px_32px_rgba(26,35,126,0.25)] transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined">save</span>
            Save &amp; Generate PDF
        </button>
</div>
</body></html>
